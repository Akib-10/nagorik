<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — নাগরিক</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>

<header class="site-header" id="top">
  <div class="header-inner">
    <a href="index.html" class="brand" aria-label="নাগরিক home">
      <img src="assets/images/logo_for_dark_mode.png" alt="নাগরিক logo">
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="browse_feed.html">Browse feed</a>
    </nav>
    <div class="header-actions" style="margin-left:auto;">
      <a href="index.html" class="btn btn-ghost">← Back home</a>
    </div>
  </div>
</header>

<main>
  <section class="page-hero" style="padding-bottom:0;">
    <div class="wrap">
      <span class="eyebrow">Welcome</span>
      <h1 id="authHeading">Log in to Nagorik</h1>
      <p id="authSub">Track your reports, vote on issues, and follow your neighbourhood.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="wrap">
      <div class="panel" style="max-width:440px;">

        <div class="auth-tabs">
          <button type="button" class="active" data-tab="login">Log in</button>
          <button type="button" data-tab="register">Register</button>
        </div>

        <!-- LOG IN -->
        <div class="auth-panel active" data-panel="login">
          <form data-auth-form>
            <div class="form-row">
              <label for="loginEmail">Email</label>
              <input id="loginEmail" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-row">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" type="password" placeholder="••••••••" required>
            </div>
            <div class="form-actions" style="flex-direction:column;">
              <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log in</button>
            </div>
            <p class="form-note" style="margin-top:14px; font-size:13.5px; color:var(--muted);"></p>
          </form>
        </div>

        <!-- REGISTER -->
        <div class="auth-panel" data-panel="register">
          <form data-auth-form>
            <div class="form-row">
              <label for="regName">Full name</label>
              <input id="regName" type="text" placeholder="Your name" required>
            </div>
            <div class="form-row">
              <label for="regEmail">Email</label>
              <input id="regEmail" type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-row">
              <label for="regPassword">Password</label>
              <input id="regPassword" type="password" placeholder="Create a password" required>
            </div>
            <div class="form-actions" style="flex-direction:column;">
              <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Create account</button>
            </div>
            <p class="form-note" style="margin-top:14px; font-size:13.5px; color:var(--muted);"></p>
          </form>
        </div>

      </div>
    </div>
  </section>
</main>

<footer class="site-footer" style="margin-top:0;">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:0; padding-top:0;">
      <span>© 2026 Nagorik. Made with ♥ for Dhaka.</span>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script>
  // Swap heading/subtext to match the active tab
  document.querySelectorAll('.auth-tabs button').forEach(tab => {
    tab.addEventListener('click', () => {
      const heading = document.getElementById('authHeading');
      const sub = document.getElementById('authSub');
      if (tab.dataset.tab === 'register') {
        heading.textContent = 'Create your Nagorik account';
        sub.textContent = "It's free — join your neighbourhood in under a minute.";
      } else {
        heading.textContent = 'Log in to Nagorik';
        sub.textContent = 'Track your reports, vote on issues, and follow your neighbourhood.';
      }
    });
  });
</script>
</body>
</html>
